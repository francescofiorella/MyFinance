name: Release

# Started by hand: gh workflow run release.yml -f version=X.Y.Z (docs/releasing.md).
# Takes the release notes from CHANGELOG.md's Unreleased section and generates the baseline profile on
# an emulator. Commits the profile, the version and the changelog (Unreleased renamed to X.Y.Z) as
# "Release X.Y.Z", tags that commit, builds the signed APK, publishes the GitHub Release and posts it
# to Telegram. A dry run does the same on a throwaway branch, tag and pre-release, without the
# Telegram post.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, MAJOR.MINOR.PATCH
        required: true
        type: string
      dry_run:
        description: Publish to a throwaway branch and pre-release, leaving main alone
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

# None by default: each job asks for what it needs, so only the one that pushes can write.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check the version
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      target_branch: ${{ steps.check.outputs.target_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version
        id: check
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A release runs from main, not $GITHUB_REF."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The version must be MAJOR.MINOR.PATCH, was '$VERSION'."
            exit 1
          fi
          if [ "${BASH_REMATCH[2]}" -ge 1000 ] || [ "${BASH_REMATCH[3]}" -ge 1000 ]; then
            echo "::error::MINOR and PATCH must be below 1000, was '$VERSION'."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION already exists."
            exit 1
          fi
          # Only release tags count: dry-run tags never block a real release.
          previous_tag=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$previous_tag" ] && [ "$(printf '%s\n%s\n' "${previous_tag#v}" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::$VERSION is not newer than the last release, $previous_tag."
            exit 1
          fi
          # The notes are the "## Unreleased" section of CHANGELOG.md, without its leading blank lines.
          # Written by hand, so they are checked here rather than trimmed later.
          notes=$(awk '{ sub(/\r$/, "") } /^## / { if (found) exit; if ($0 == "## Unreleased") { found = 1; next } } found' CHANGELOG.md | sed '/./,$!d')
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has nothing under '## Unreleased': write the release notes there and push them first (docs/releasing.md)."
            exit 1
          fi
          # A Telegram caption holds 1024 characters, 15 of them taken by the "Release notes:" line.
          if [ "${#notes}" -gt 1009 ]; then
            echo "::error::The release notes have ${#notes} characters; the Telegram caption leaves room for 1009."
            exit 1
          fi
          printf '%s\n' "$notes" > notes.md
          if [ "$DRY_RUN" = "true" ]; then
            tag="v$VERSION-dry.$RUN_NUMBER"
            target_branch="release-dry/$VERSION"
          else
            tag="v$VERSION"
            target_branch="main"
          fi
          {
            echo "version=$VERSION"
            echo "tag=$tag"
            echo "target_branch=$target_branch"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION as $tag on $target_branch, after ${previous_tag:-no earlier release}."
          cat notes.md

      - name: Upload the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  # Nothing is generated or released unless ci.yml (lint, JVM and screenshot tests, device tests)
  # passed on this exact commit; a run still in progress is waited for.
  ci:
    name: Wait for CI
    permissions:
      # To read the CI run of the commit being released.
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 100); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion,url --jq '.[0] // empty')
            if [ -z "$run" ]; then
              # A CI run may take a few seconds to appear after a push.
              if [ "$attempt" -le 4 ]; then
                sleep 15
                continue
              fi
              echo "::error::No CI run for $GITHUB_SHA. Push the commit to main, or start CI on it with gh workflow run ci.yml."
              exit 1
            fi
            status=$(jq -r .status <<< "$run")
            conclusion=$(jq -r .conclusion <<< "$run")
            url=$(jq -r .url <<< "$run")
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed on $GITHUB_SHA: $url"
                exit 0
              fi
              echo "::error::CI did not pass on $GITHUB_SHA ($conclusion): $url"
              exit 1
            fi
            echo "CI is $status on $GITHUB_SHA, waiting: $url"
            sleep 30
          done
          echo "::error::CI did not finish in time."
          exit 1

  profile:
    name: Generate the baseline profile
    needs: [prepare, ci]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space for the emulator image
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          swap-storage: true
          docker-images: false
          large-packages: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@v7

      - name: Use the CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The profiled build is signed like the release, so Firebase sees the same app.
      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing (docs/releasing.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Removed first, so the check below proves this run wrote them.
      - name: Remove the committed profile
        run: rm -f app/src/main/generated/baselineProfiles/*.txt

      - name: Generate on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BP_EMAIL: ${{ secrets.BP_EMAIL }}
          BP_PASSWORD: ${{ secrets.BP_PASSWORD }}
        with:
          # Same device as ci.yml's device tests.
          api-level: 36
          target: google_atd
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          # Only the generator: the benchmarks skip themselves here and would be reported as failures.
          script: ./gradlew :app:generateBaselineProfile "-Pandroid.testInstrumentationRunnerArguments.class=com.frafio.myfinance.baselineProfile.BaselineProfileGenerator" "-Pandroid.testInstrumentationRunnerArguments.bpEmail=$BP_EMAIL" "-Pandroid.testInstrumentationRunnerArguments.bpPassword=$BP_PASSWORD"

      # The success criterion of baselineProfile/README.md: both files, the startup one clearly smaller.
      - name: Check the profile
        run: |
          dir=app/src/main/generated/baselineProfiles
          for file in baseline-prof.txt startup-prof.txt; do
            if [ ! -s "$dir/$file" ]; then
              echo "::error::$dir/$file was not generated."
              exit 1
            fi
          done
          baseline=$(wc -l < "$dir/baseline-prof.txt")
          startup=$(wc -l < "$dir/startup-prof.txt")
          echo "baseline-prof.txt: $baseline lines, startup-prof.txt: $startup lines"
          if [ "$startup" -ge "$baseline" ]; then
            echo "::error::startup-prof.txt is not smaller than baseline-prof.txt: the startup flags did not take effect."
            exit 1
          fi

      - name: Upload the profile
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles/*.txt

      - name: Upload the generator reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile-reports
          path: |
            baselineProfile/build/reports/androidTests
            baselineProfile/build/outputs/androidTest-results

  release:
    name: Build and publish
    needs: [prepare, profile]
    permissions:
      # To push the release commit and tag, and to create the GitHub Release.
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
      APK: MyFinance ${{ needs.prepare.outputs.version }}.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use the CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Download the baseline profile
        uses: actions/download-artifact@v7
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles

      - name: Download the release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes

      # The changelog's Unreleased entries become this version's, under a new empty Unreleased heading.
      - name: Commit and tag the version, profile and changelog
        run: |
          sed -i "s/^versionName=.*/versionName=$VERSION/" app/version.properties
          sed -i "s/^## Unreleased\r\?$/## Unreleased\n\n## $VERSION/" CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/version.properties app/src/main/generated/baselineProfiles CHANGELOG.md
          git commit -m "Release $VERSION"
          git tag -a "$TAG" -m "MyFinance $VERSION"

      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing (docs/releasing.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_FILE"
          ./gradlew :app:assembleRelease
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$APK"

      # Atomic: if main moved since the run started, neither the commit nor the tag lands.
      - name: Push the release commit and tag
        run: git push --atomic origin "HEAD:refs/heads/$TARGET_BRANCH" "refs/tags/$TAG"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=()
          if [ "$DRY_RUN" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "$APK#$APK" --title "MyFinance $VERSION" --notes-file notes.md --verify-tag "${flags[@]}"

      - name: Upload the APK and notes
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            MyFinance *.apk
            notes.md

  # Its own job, so a failed post is retried with `gh run rerun <id> --failed` without releasing again.
  telegram:
    name: Post to Telegram
    needs: [prepare, release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK: MyFinance ${{ needs.prepare.outputs.version }}.apk
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Download the APK and notes
        uses: actions/download-artifact@v7
        with:
          name: release

      # One message: the APK, with the release notes as its caption. Plain text (no parse_mode) and
      # --form-string, so characters in the notes can never make curl or Telegram misread them.
      - name: Post the APK with the release notes
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::The TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing (docs/releasing.md)."
            exit 1
          fi
          # Within the 1024 characters a caption holds: the prepare job checked it.
          caption="Release notes:"$'\n'"$(cat notes.md)"
          if ! curl --fail-with-body -sS -o response.json "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
              --form-string "chat_id=$TELEGRAM_CHAT_ID" -F "document=@$APK" --form-string "caption=$caption"; then
            cat response.json
            exit 1
          fi
