name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, JVM tests and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use the CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Lint and the custom lint rules
        run: ./gradlew :app:lintDebug :lint:test

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      - name: JVM tests, verifying the screenshot goldens
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.verify=true

      - name: Upload JVM test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest/*.xml

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*

  device:
    name: Device tests, coverage and SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Pinned like the actions: "latest" once changed under an unchanged commit. To upgrade, take the
      # version and the firebase-tools-linux sha256 from github.com/firebase/firebase-tools/releases.
      FIREBASE_TOOLS_VERSION: 15.30.2
      FIREBASE_TOOLS_SHA256: c831070daf997aa308f7fbe0089b1f0cf3309b0b2c16652d5812e42734e4a2f4
    steps:
      - name: Free disk space for the emulator image
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          swap-storage: true
          docker-images: false
          large-packages: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # SonarCloud reads the history to tell new code from old.
          fetch-depth: 0

      - name: Use the CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install the Firebase CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$HOME/.local/bin/firebase" \
            "https://github.com/firebase/firebase-tools/releases/download/v${FIREBASE_TOOLS_VERSION}/firebase-tools-linux"
          echo "${FIREBASE_TOOLS_SHA256}  $HOME/.local/bin/firebase" | sha256sum --check
          chmod +x "$HOME/.local/bin/firebase"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Each CLI version downloads its own emulator versions, so the key follows the CLI.
      - name: Cache the Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}-${{ hashFiles('firebase.json') }}

      - name: Device tests against the Firebase emulators
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # The newest test-optimised (ATD) image; the full API 37 image did not boot on the runner.
          api-level: 36
          target: google_atd
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          script: firebase emulators:exec --only auth,firestore "./gradlew :app:connectedDebugAndroidTest"

      - name: JVM tests for coverage
        # The goldens are verified by the other job.
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.verify=false

      - name: Combined coverage report and lint report
        run: ./gradlew :app:createDebugCombinedCoverageReport :app:lintDebug

      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./gradlew sonar

      - name: Upload device test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: app/build/reports/androidTests

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: app/build/reports/jacoco
