// Used when (re)writing gradle/verification-metadata.xml (docs/testing.md#dependency-verification):
// resolves every resolvable configuration of every project, so libraries that no task of the
// update run happens to download still get a checksum.
allprojects { p ->
    p.tasks.register('resolveAllConfigurations') {
        notCompatibleWithConfigurationCache('Resolves configurations at execution time on purpose')
        doLast {
            p.configurations.matching { it.canBeResolved }.toList().each { configuration ->
                try {
                    configuration.resolve()
                } catch (Exception ignored) {
                    // Some configurations need variant attributes only a real task provides.
                }
            }
            // AGP downloads the aapt2 binary for the current OS only; CI runs on Linux. Its version is
            // "<AGP version>-<aapt2 build>", the build number shipped inside AGP itself.
            def agp = p.plugins.findPlugin('com.android.application')
            if (agp != null) {
                def loader = agp.class.classLoader
                def props = new Properties()
                loader.getResourceAsStream('com/android/build/gradle/internal/res/aapt2_version.properties')
                    ?.withCloseable { props.load(it) }
                def agpVersion = loader.loadClass('com.android.Version').getField('ANDROID_GRADLE_PLUGIN_VERSION').get(null)
                if (props.aapt2Version) {
                    ['linux', 'osx', 'windows'].each { os ->
                        p.configurations.detachedConfiguration(
                            p.dependencies.create("com.android.tools.build:aapt2:$agpVersion-${props.aapt2Version}:$os")
                        ).resolve()
                    }
                }
            }
        }
    }
}
